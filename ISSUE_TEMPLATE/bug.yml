name: Bug report
description: Something does not behave as documented
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened
      description: Include the trace ID from the X-Trace-Id header or error response when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Reference the domain rule or contract if possible.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit

name: Story
description: A unit of product work from the roadmap
title: "[SCM-EPx-USyy] "
labels: ["story"]
body:
  - type: input
    id: story
    attributes:
      label: Story ID
      description: ID from docs/roadmap.md
      placeholder: SCM-EP2-US07
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the user or system can do when this is done.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable outcomes.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Domain rules, contracts, and ADRs this story implements.

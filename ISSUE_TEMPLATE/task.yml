name: Task
description: A piece of planned work
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible or different when this is done.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional context, acceptance criteria, or links to docs and decisions.
